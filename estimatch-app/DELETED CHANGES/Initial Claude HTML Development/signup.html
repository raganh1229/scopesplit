<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up &#8212; EstiMatch</title>
<link rel="stylesheet" href="card-components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-stack);
    background: var(--bg-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .auth-wrapper { width: 100%; max-width: 420px; padding: 24px; }
  .auth-logo {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 32px;
    font-size: 20px; font-weight: 700;
  }
  .auth-logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--blue-600);
    display: flex; align-items: center; justify-content: center;
  }
  .auth-logo-icon svg { width: 20px; height: 20px; }
  .auth-card {
    background: var(--bg-primary);
    border: 0.5px solid var(--border-default);
    border-radius: 12px; padding: 32px;
  }
  .auth-card h1 {
    font-size: 22px; font-weight: 700;
    margin-bottom: 6px; text-align: center;
  }
  .auth-card .subtitle {
    font-size: 14px; color: var(--text-secondary);
    text-align: center; margin-bottom: 24px;
  }

  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 11px; border-radius: 8px;
    border: 0.5px solid var(--border-default);
    background: var(--bg-primary); color: var(--text-primary);
    font-family: var(--font-stack); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background 0.15s ease;
  }
  .google-btn:hover { background: var(--bg-surface); }
  .google-btn svg { width: 18px; height: 18px; }

  .auth-divider {
    display: flex; align-items: center; gap: 12px; margin: 20px 0;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 0.5px; background: var(--border-default);
  }
  .auth-divider span {
    font-size: 12px; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;
  }
  .form-input {
    width: 100%; padding: 10px 14px;
    border: 0.5px solid var(--border-default);
    border-radius: 8px; font-family: var(--font-stack);
    font-size: 15px; color: var(--text-primary);
    background: var(--bg-page);
    transition: border-color 0.15s ease;
  }
  .form-input:focus {
    outline: none; border-color: var(--blue-400);
    box-shadow: 0 0 0 3px rgba(55,138,221,0.1);
  }
  .form-input::placeholder { color: var(--text-tertiary); }
  .form-input.error { border-color: var(--red-400); }

  .password-wrap { position: relative; }
  .password-wrap .form-input { padding-right: 42px; }
  .pw-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    color: var(--text-tertiary);
  }
  .pw-toggle svg {
    width: 18px; height: 18px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .pw-toggle:hover { color: var(--text-secondary); }

  .form-hint {
    font-size: 12px; color: var(--text-tertiary);
    margin-top: 4px;
  }
  .form-error {
    display: none; font-size: 13px; color: var(--red-600); margin-top: 4px;
  }
  .form-error.show { display: block; }

  /* Password strength indicator */
  .pw-strength {
    display: flex; gap: 4px; margin-top: 8px;
  }
  .pw-strength-bar {
    flex: 1; height: 3px; border-radius: 2px;
    background: var(--border-light);
    transition: background 0.2s ease;
  }
  .pw-strength[data-strength="1"] .pw-strength-bar:nth-child(1) { background: var(--red-400); }
  .pw-strength[data-strength="2"] .pw-strength-bar:nth-child(-n+2) { background: var(--amber-200); }
  .pw-strength[data-strength="3"] .pw-strength-bar:nth-child(-n+3) { background: var(--green-200); }
  .pw-strength[data-strength="4"] .pw-strength-bar { background: var(--green-400); }

  /* Captcha placeholder */
  .captcha-placeholder {
    border: 0.5px solid var(--border-default);
    border-radius: 8px; padding: 14px;
    background: var(--bg-surface);
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; cursor: pointer;
  }
  .captcha-check {
    width: 24px; height: 24px; border-radius: 4px;
    border: 2px solid var(--border-default);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease; flex-shrink: 0;
  }
  .captcha-check.checked {
    background: var(--green-400); border-color: var(--green-400);
  }
  .captcha-check.checked::after {
    content: '';
    width: 10px; height: 6px;
    border-left: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(-45deg); margin-top: -2px;
  }
  .captcha-label {
    font-size: 14px; color: var(--text-secondary);
  }
  .captcha-brand {
    margin-left: auto; font-size: 11px; color: var(--text-tertiary);
  }

  .form-submit {
    width: 100%; padding: 12px; border-radius: 8px;
    background: var(--text-primary); color: #fff;
    font-family: var(--font-stack); font-size: 15px; font-weight: 600;
    border: none; cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .form-submit:hover { opacity: 0.88; }
  .form-submit:disabled { opacity: 0.4; cursor: not-allowed; }

  .auth-footer {
    text-align: center; margin-top: 20px;
    font-size: 14px; color: var(--text-secondary);
  }
  .auth-footer a { color: var(--blue-600); font-weight: 500; }
  .auth-footer a:hover { text-decoration: underline; }

  .auth-terms {
    font-size: 12px; color: var(--text-tertiary);
    text-align: center; margin-top: 14px; line-height: 1.5;
  }
  .auth-terms a { color: var(--text-secondary); text-decoration: underline; }

  @media (max-width: 480px) {
    .auth-card { padding: 24px 20px; }
    .auth-card h1 { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="auth-wrapper">
  <a class="auth-logo" href="index.html">
    <div class="auth-logo-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </div>
    EstiMatch
  </a>

  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Start comparing estimates in minutes</p>

    <button class="google-btn" type="button">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form id="signupForm" onsubmit="return false;">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required>
        <div class="form-error" id="emailError">This email is already registered.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-wrap">
          <input class="form-input" type="password" id="password" placeholder="Create a password" required>
          <button class="pw-toggle" type="button" id="pwToggle" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pw-strength" id="pwStrength" data-strength="0">
          <div class="pw-strength-bar"></div>
          <div class="pw-strength-bar"></div>
          <div class="pw-strength-bar"></div>
          <div class="pw-strength-bar"></div>
        </div>
        <div class="form-hint">At least 8 characters</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm password</label>
        <input class="form-input" type="password" id="confirmPassword" placeholder="Confirm your password" required>
        <div class="form-error" id="confirmError">Passwords do not match.</div>
      </div>

      <div class="captcha-placeholder" id="captchaBox">
        <div class="captcha-check" id="captchaCheck"></div>
        <span class="captcha-label">I'm not a robot</span>
        <span class="captcha-brand">Turnstile</span>
      </div>

      <button class="form-submit" type="submit" id="submitBtn" disabled>Sign up</button>
    </form>

    <div class="auth-terms">
      By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>
  </div>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<script>
(function () {
  var pw = document.getElementById('password');
  var confirm = document.getElementById('confirmPassword');
  var captchaBox = document.getElementById('captchaBox');
  var captchaCheck = document.getElementById('captchaCheck');
  var submitBtn = document.getElementById('submitBtn');
  var confirmError = document.getElementById('confirmError');
  var pwStrength = document.getElementById('pwStrength');
  var captchaDone = false;

  /* Password visibility */
  var pwToggle = document.getElementById('pwToggle');
  pwToggle.addEventListener('click', function () {
    var isPassword = pw.type === 'password';
    pw.type = isPassword ? 'text' : 'password';
    pwToggle.innerHTML = isPassword
      ? '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  });

  /* Password strength */
  pw.addEventListener('input', function () {
    var val = pw.value;
    var s = 0;
    if (val.length >= 8) s++;
    if (/[A-Z]/.test(val)) s++;
    if (/[0-9]/.test(val)) s++;
    if (/[^A-Za-z0-9]/.test(val)) s++;
    pwStrength.setAttribute('data-strength', s);
    validate();
  });

  /* Confirm match */
  confirm.addEventListener('input', function () {
    if (confirm.value && confirm.value !== pw.value) {
      confirmError.classList.add('show');
      confirm.classList.add('error');
    } else {
      confirmError.classList.remove('show');
      confirm.classList.remove('error');
    }
    validate();
  });

  /* Captcha toggle (demo) */
  captchaBox.addEventListener('click', function () {
    captchaDone = !captchaDone;
    captchaCheck.classList.toggle('checked', captchaDone);
    validate();
  });

  function validate () {
    var emailOk = document.getElementById('email').value.includes('@');
    var pwOk = pw.value.length >= 8;
    var matchOk = confirm.value === pw.value && confirm.value.length > 0;
    submitBtn.disabled = !(emailOk && pwOk && matchOk && captchaDone);
  }
})();
</script>
</body>
</html>
