<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email &#8212; EstiMatch</title>
<link rel="stylesheet" href="card-components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-stack);
    background: var(--bg-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .auth-wrapper { width: 100%; max-width: 420px; padding: 24px; }
  .auth-logo {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 32px;
    font-size: 20px; font-weight: 700;
  }
  .auth-logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--blue-600);
    display: flex; align-items: center; justify-content: center;
  }
  .auth-logo-icon svg { width: 20px; height: 20px; }
  .auth-card {
    background: var(--bg-primary);
    border: 0.5px solid var(--border-default);
    border-radius: 12px; padding: 32px; text-align: center;
  }

  /* Mail icon */
  .verify-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--blue-50);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .verify-icon svg {
    width: 28px; height: 28px;
    stroke: var(--blue-600); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  .auth-card h1 {
    font-size: 22px; font-weight: 700; margin-bottom: 6px;
  }
  .auth-card .subtitle {
    font-size: 14px; color: var(--text-secondary);
    margin-bottom: 28px; line-height: 1.5;
  }
  .auth-card .subtitle strong {
    color: var(--text-primary); font-weight: 600;
  }

  /* 6-digit code input */
  .code-inputs {
    display: flex; justify-content: center; gap: 8px;
    margin-bottom: 24px;
  }
  .code-input {
    width: 48px; height: 56px;
    border: 0.5px solid var(--border-default);
    border-radius: 10px; text-align: center;
    font-family: var(--font-stack);
    font-size: 24px; font-weight: 600;
    color: var(--text-primary);
    background: var(--bg-page);
    transition: border-color 0.15s ease;
    appearance: none;
    -webkit-appearance: none;
  }
  .code-input:focus {
    outline: none; border-color: var(--blue-400);
    box-shadow: 0 0 0 3px rgba(55,138,221,0.1);
  }
  .code-input.filled { border-color: var(--text-primary); }

  .form-error {
    display: none; font-size: 13px; color: var(--red-600);
    margin: -16px 0 16px;
  }
  .form-error.show { display: block; }

  .form-submit {
    width: 100%; padding: 12px; border-radius: 8px;
    background: var(--text-primary); color: #fff;
    font-family: var(--font-stack); font-size: 15px; font-weight: 600;
    border: none; cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .form-submit:hover { opacity: 0.88; }
  .form-submit:disabled { opacity: 0.4; cursor: not-allowed; }

  .resend-row {
    margin-top: 20px; font-size: 14px; color: var(--text-secondary);
  }
  .resend-link {
    color: var(--blue-600); font-weight: 500;
    cursor: pointer; background: none; border: none;
    font-family: var(--font-stack); font-size: 14px;
  }
  .resend-link:hover { text-decoration: underline; }
  .resend-link:disabled {
    color: var(--text-tertiary); cursor: not-allowed;
    text-decoration: none;
  }

  .back-link {
    display: inline-block; margin-top: 16px;
    font-size: 14px; color: var(--text-secondary);
  }
  .back-link a {
    color: var(--blue-600); font-weight: 500; text-decoration: none;
  }
  .back-link a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .auth-card { padding: 24px 20px; }
    .code-input { width: 42px; height: 48px; font-size: 20px; }
  }
</style>
</head>
<body>

<div class="auth-wrapper">
  <a class="auth-logo" href="index.html">
    <div class="auth-logo-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </div>
    EstiMatch
  </a>

  <div class="auth-card">
    <div class="verify-icon">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </div>
    <h1>Check your email</h1>
    <p class="subtitle">We sent a verification code to<br><strong>rharrison@example.com</strong></p>

    <div class="code-inputs" id="codeInputs">
      <input class="code-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code">
      <input class="code-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="code-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="code-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="code-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="code-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>

    <div class="form-error" id="codeError">Invalid verification code. Please try again.</div>

    <button class="form-submit" id="verifyBtn" disabled>Verify</button>

    <div class="resend-row">
      Didn't receive a code?
      <button class="resend-link" id="resendBtn">Resend code</button>
    </div>

    <div class="back-link">
      <a href="signup.html">&larr; Use a different email</a>
    </div>
  </div>
</div>

<script>
(function () {
  var inputs = document.querySelectorAll('.code-input');
  var verifyBtn = document.getElementById('verifyBtn');
  var resendBtn = document.getElementById('resendBtn');

  /* Auto-advance on digit entry */
  inputs.forEach(function (inp, i) {
    inp.addEventListener('input', function () {
      inp.value = inp.value.replace(/[^0-9]/g, '');
      if (inp.value && i < inputs.length - 1) {
        inputs[i + 1].focus();
      }
      inp.classList.toggle('filled', inp.value.length > 0);
      checkComplete();
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !inp.value && i > 0) {
        inputs[i - 1].focus();
      }
    });
    inp.addEventListener('paste', function (e) {
      e.preventDefault();
      var pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      for (var j = 0; j < Math.min(pasted.length, inputs.length - i); j++) {
        inputs[i + j].value = pasted[j];
        inputs[i + j].classList.add('filled');
      }
      var nextIdx = Math.min(i + pasted.length, inputs.length - 1);
      inputs[nextIdx].focus();
      checkComplete();
    });
  });

  function checkComplete () {
    var filled = true;
    inputs.forEach(function (inp) { if (!inp.value) filled = false; });
    verifyBtn.disabled = !filled;
  }

  /* Resend cooldown */
  resendBtn.addEventListener('click', function () {
    resendBtn.disabled = true;
    var sec = 60;
    resendBtn.textContent = 'Resend in ' + sec + 's';
    var timer = setInterval(function () {
      sec--;
      resendBtn.textContent = 'Resend in ' + sec + 's';
      if (sec <= 0) {
        clearInterval(timer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
      }
    }, 1000);
  });
})();
</script>
</body>
</html>
