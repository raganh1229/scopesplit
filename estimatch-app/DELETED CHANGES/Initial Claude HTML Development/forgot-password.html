<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password &#8212; EstiMatch</title>
<link rel="stylesheet" href="card-components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-stack);
    background: var(--bg-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .auth-wrapper { width: 100%; max-width: 420px; padding: 24px; }
  .auth-logo {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 32px;
    font-size: 20px; font-weight: 700;
  }
  .auth-logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--blue-600);
    display: flex; align-items: center; justify-content: center;
  }
  .auth-logo-icon svg { width: 20px; height: 20px; }
  .auth-card {
    background: var(--bg-primary);
    border: 0.5px solid var(--border-default);
    border-radius: 12px; padding: 32px; text-align: center;
  }
  .auth-card h1 {
    font-size: 22px; font-weight: 700; margin-bottom: 6px;
  }
  .auth-card .subtitle {
    font-size: 14px; color: var(--text-secondary);
    margin-bottom: 24px; line-height: 1.5;
  }

  .form-group { margin-bottom: 20px; text-align: left; }
  .form-label {
    display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px;
  }
  .form-input {
    width: 100%; padding: 10px 14px;
    border: 0.5px solid var(--border-default);
    border-radius: 8px; font-family: var(--font-stack);
    font-size: 15px; color: var(--text-primary);
    background: var(--bg-page);
    transition: border-color 0.15s ease;
  }
  .form-input:focus {
    outline: none; border-color: var(--blue-400);
    box-shadow: 0 0 0 3px rgba(55,138,221,0.1);
  }
  .form-input::placeholder { color: var(--text-tertiary); }

  .form-submit {
    width: 100%; padding: 12px; border-radius: 8px;
    background: var(--text-primary); color: #fff;
    font-family: var(--font-stack); font-size: 15px; font-weight: 600;
    border: none; cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .form-submit:hover { opacity: 0.88; }

  .back-link {
    display: inline-block; margin-top: 20px;
    font-size: 14px; color: var(--text-secondary);
  }
  .back-link a {
    color: var(--blue-600); font-weight: 500; text-decoration: none;
  }
  .back-link a:hover { text-decoration: underline; }

  /* Success state */
  .sent-state { display: none; }
  .sent-state.show { display: block; }
  .form-state { display: block; }
  .form-state.hide { display: none; }

  .sent-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--green-50);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .sent-icon svg {
    width: 28px; height: 28px;
    stroke: var(--green-600); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  @media (max-width: 480px) {
    .auth-card { padding: 24px 20px; }
    .auth-card h1 { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="auth-wrapper">
  <a class="auth-logo" href="index.html">
    <div class="auth-logo-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </div>
    EstiMatch
  </a>

  <div class="auth-card">
    <!-- Form state -->
    <div class="form-state" id="formState">
      <h1>Forgot your password?</h1>
      <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required>
      </div>
      <button class="form-submit" type="button" id="sendBtn">Send reset link</button>
      <div class="back-link"><a href="login.html">&larr; Back to sign in</a></div>
    </div>

    <!-- Sent state -->
    <div class="sent-state" id="sentState">
      <div class="sent-icon">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <h1>Check your email</h1>
      <p class="subtitle">We sent a password reset link to <strong id="sentEmail"></strong>. Check your inbox and follow the instructions.</p>
      <div class="back-link"><a href="login.html">&larr; Back to sign in</a></div>
    </div>
  </div>
</div>

<script>
(function () {
  document.getElementById('sendBtn').addEventListener('click', function () {
    var email = document.getElementById('email').value.trim();
    if (!email) return;
    document.getElementById('sentEmail').textContent = email;
    document.getElementById('formState').classList.add('hide');
    document.getElementById('sentState').classList.add('show');
  });
})();
</script>
</body>
</html>
