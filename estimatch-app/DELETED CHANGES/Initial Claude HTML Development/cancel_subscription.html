<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancel Subscription &#8212; EstiMatch</title>
<link rel="stylesheet" href="card-components.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg-page);
    font-family: var(--font-stack);
    font-size: 13px;
    color: var(--text-primary);
  }

  .app-layout { display: flex; min-height: 100vh; }
  .app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---- Sidebar (identical to settings.html) ---- */
  .sidebar {
    width: 52px; height: 100vh;
    position: sticky; top: 0;
    background: #2C2C2C; border-right: none;
    display: flex; flex-direction: column;
    padding: 12px 0;
    transition: width 0.2s ease;
    overflow: hidden; flex-shrink: 0; z-index: 50;
  }
  .sidebar:hover { width: 200px; }
  .sidebar-brand {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 6px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 8px; white-space: nowrap; overflow: hidden;
  }
  .sidebar-brand-icon {
    width: 24px; height: 24px; border-radius: 6px;
    background: var(--blue-600);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 8px;
  }
  .sidebar-brand-icon svg { width: 14px; height: 14px; }
  .sidebar-brand-text {
    font-size: 13px; font-weight: 600;
    color: rgba(255,255,255,0.9);
    opacity: 0; transition: opacity 0.15s ease 0.05s;
  }
  .sidebar:hover .sidebar-brand-text { opacity: 1; }
  .sidebar-nav {
    display: flex; flex-direction: column; gap: 2px; padding: 0 6px;
    flex: 1; min-height: 0; overflow-y: auto;
  }
  .sidebar-nav::-webkit-scrollbar { width: 0; }
  .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-radius: 6px;
    cursor: pointer; white-space: nowrap; overflow: hidden;
    transition: background 0.15s ease; text-decoration: none;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.06); }
  .sidebar-item.active { background: rgba(255,255,255,0.09); }
  .sidebar-item-icon {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 10px;
  }
  .sidebar-item-icon svg {
    width: 18px; height: 18px;
    stroke: rgba(255,255,255,0.35); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .sidebar-item.active .sidebar-item-icon svg { stroke: rgba(255,255,255,0.85); }
  .sidebar-item-label {
    font-size: 13px; color: rgba(255,255,255,0.5);
    opacity: 0; transition: opacity 0.15s ease 0.05s;
  }
  .sidebar:hover .sidebar-item-label { opacity: 1; }
  .sidebar-item.active .sidebar-item-label { color: rgba(255,255,255,0.9); }

  .sidebar-user {
    padding: 8px 6px; margin-top: auto;
    border-top: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }
  .sidebar-user-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; background: none; border: none;
    padding: 8px 0; border-radius: 6px;
    cursor: pointer; white-space: nowrap;
    overflow: hidden; transition: background 0.15s ease;
  }
  .sidebar-user-btn:hover { background: rgba(255,255,255,0.06); }
  .sidebar-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #D4C9A8; color: #2C2C2C;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; letter-spacing: 0.3px; margin-left: 6px;
  }
  .sidebar-user-name {
    font-size: 13px; color: rgba(255,255,255,0.7);
    opacity: 0; transition: opacity 0.15s ease 0.05s;
  }
  .sidebar:hover .sidebar-user-name { opacity: 1; }
  .user-menu {
    display: none; position: absolute;
    left: calc(100% + 8px); bottom: 0;
    background: #2C2C2C; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; min-width: 200px;
    padding: 8px; z-index: 999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .user-menu.open { display: block; }
  .user-menu-email {
    padding: 8px 10px 6px; font-size: 12px;
    color: rgba(255,255,255,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 4px;
  }
  .user-menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    color: rgba(255,255,255,0.7); font-size: 13px;
    text-decoration: none; transition: background 0.1s ease;
  }
  .user-menu-item:hover { background: rgba(255,255,255,0.06); }
  .user-menu-item svg {
    width: 16px; height: 16px;
    stroke: rgba(255,255,255,0.4); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ============================================
     CANCEL PAGE CONTENT
     ============================================ */
  .cancel-content {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .cancel-card {
    max-width: 520px; width: 100%;
    background: var(--bg-primary);
    border: 0.5px solid var(--border-default);
    border-radius: 14px; padding: 40px; text-align: center;
  }

  .cancel-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--red-50);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .cancel-icon svg {
    width: 28px; height: 28px;
    stroke: var(--red-600); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  .cancel-card h1 {
    font-size: 22px; font-weight: 700; margin-bottom: 8px;
  }
  .cancel-card .subtitle {
    font-size: 14px; color: var(--text-secondary);
    line-height: 1.6; margin-bottom: 24px;
    max-width: 400px; margin-left: auto; margin-right: auto;
  }

  .cancel-textarea {
    width: 100%; min-height: 100px; padding: 12px 14px;
    border: 0.5px solid var(--border-default);
    border-radius: 8px; font-family: var(--font-stack);
    font-size: 14px; color: var(--text-primary);
    background: var(--bg-page); resize: vertical;
    line-height: 1.5; margin-bottom: 8px;
    transition: border-color 0.15s ease;
  }
  .cancel-textarea:focus {
    outline: none; border-color: var(--blue-400);
    box-shadow: 0 0 0 3px rgba(55,138,221,0.1);
  }
  .cancel-textarea::placeholder { color: var(--text-tertiary); }
  .cancel-textarea-hint {
    font-size: 12px; color: var(--text-tertiary);
    text-align: left; margin-bottom: 24px;
  }

  .cancel-btn {
    width: 100%; padding: 12px; border-radius: 8px;
    background: var(--red-600); color: #fff;
    font-family: var(--font-stack); font-size: 15px; font-weight: 600;
    border: none; cursor: pointer;
    transition: opacity 0.15s ease;
    margin-bottom: 12px;
  }
  .cancel-btn:hover { opacity: 0.88; }

  .keep-link {
    display: inline-block; font-size: 14px;
    color: var(--text-secondary);
  }
  .keep-link a {
    color: var(--blue-600); font-weight: 500;
    text-decoration: none;
  }
  .keep-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="app-layout">

<!-- Sidebar -->
<nav class="sidebar" id="appSidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </div>

  <div class="sidebar-nav">

      </span>

      <span class="sidebar-item-label">Comparisons</span>
    </a>
    <div style="height:1px; background:rgba(255,255,255,0.06); margin:8px 6px;"></div>
    <a class="sidebar-item active" href="settings.html">
      <span class="sidebar-item-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
      <span class="sidebar-item-label">Settings</span>
    </a>
    <a class="sidebar-item" href="#">
      <span class="sidebar-item-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </span>
      <span class="sidebar-item-label">Language</span>

    <a class="sidebar-item" href="#">
      <span class="sidebar-item-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

      <span class="sidebar-item-label">Get Help</span>

  </div>
  <div class="sidebar-user" id="sidebarUser">
    <button class="sidebar-user-btn" id="userMenuBtn">
      <div class="sidebar-avatar">RH</div>
      <span class="sidebar-user-name">Ragan Harrison</span>
    </button>
    <div class="user-menu" id="userMenu">
      <div class="user-menu-email">rharrison@example.com</div>
      <a class="user-menu-item" href="#">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </a>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="app-main">
  <div class="cancel-content">
    <div class="cancel-card">
      <div class="cancel-icon">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <h1>We're sorry to see you go</h1>
      <p class="subtitle">This software is built and supported by one person. Any feedback you can share would mean a lot.</p>

      <textarea class="cancel-textarea" placeholder="What could we have done better?" id="feedbackText"></textarea>
      <div class="cancel-textarea-hint">Optional &#8212; but we truly appreciate it.</div>

      <button class="cancel-btn" id="cancelBtn">Cancel my subscription</button>

      <div class="keep-link">
        <a href="settings.html">Never mind, keep my subscription</a>
      </div>
    </div>
  </div>
</div>

</div><!-- app-layout -->

<script>
(function () {
  /* User menu toggle */
  var menuBtn = document.getElementById('userMenuBtn');
  var menu = document.getElementById('userMenu');
  menuBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.addEventListener('click', function () {
    menu.classList.remove('open');
  });
})();
</script>

</body>
